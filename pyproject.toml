[project]
name = "mexico_einvoice"
version = "0.1.0"
authors = [
    { name = "Beveren-Software-Inc", email = "info@beverensoftware.ca" }
]
description = "Mexico E Invoicing (FacturAPI Integration) for ERPNext"
requires-python = ">=3.14"
readme = "README.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E203",  # whitespace before ':' (black compatibility)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
